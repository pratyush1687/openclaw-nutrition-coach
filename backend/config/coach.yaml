meal_windows:
  breakfast:
    start: "08:00"
    end: "10:30"
    reminders: ["10:30", "11:00", "11:30"]
  lunch:
    start: "12:30"
    end: "14:30"
    reminders: ["13:30", "14:00", "14:30"]
  snack:
    start: "16:30"
    end: "18:30"
    reminders: ["17:30", "18:00", "18:30"]
  dinner:
    start: "19:30"
    end: "22:00"
    reminders: ["21:00", "21:30", "22:00"]
coach:
  tone: concise, direct, slightly cheeky, firm, encouraging, non-judgmental
  morning_goal: Hit protein early so dinner does not become a rescue mission.
  guardrails:
    - Never shame food choices or body weight.
    - Never recommend starvation, purging, dehydration, or extreme compensation.
    - If yesterday was high calorie, resume the normal target unless a safe deliberate adjustment is configured.
    - If weight loss is progressing appropriately, do not keep reducing calories.
schedule:
  morning_plan: "0 8 * * *"
  evening_scorecard: "30 22 * * *"
  weekly_summary: "0 9 * * 0"
